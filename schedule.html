            --accent-purple: #c084fc;

            --text-sub: #a8a29e;

            padding: 0;

            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-label {
            font-size: 0.88rem;
            color: var(--text-sub);
            font-weight: 700;
            min-width: 75px;
        }

        .btn-filter {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 0.35rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-filter:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn-filter.active {
            background: var(--accent-gold);
            color: #1c1917;
            border-color: var(--accent-gold);
            font-weight: 800;
        }

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            color: #fff;
            padding: 0.45rem 0.85rem;
            font-size: 0.92rem;
            outline: none;

        }

            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-top: 0.6rem;

            font-size: 0.88rem;
            color: var(--text-sub);

            font-size: 0.88rem;
            font-weight: 700;

            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;

        .btn-action:hover {
            background: var(--accent-gold);
            color: #1c1917;

            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);

        table {

            border-collapse: collapse;
            text-align: left;
            font-size: 0.94rem;

        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-gold);
            padding: 0.85rem 1rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            white-space: nowrap;

            padding: 0.85rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            vertical-align: middle;
            line-height: 1.55;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

            display: inline-block;

            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;

            transform: translateX(-50%) translateY(0);

            </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <!-- 類別篩選 -->
            <div class="filter-row">
                <span class="filter-label">活動類別：</span>
                <button class="btn-filter active" onclick="setCategoryFilter('all', this)">全部</button>
                <button class="btn-filter" onclick="setCategoryFilter('入班志工', this)">🏫 入班服務</button>
                <button class="btn-filter" onclick="setCategoryFilter('外訓演練', this)">🎯 外訓備課</button>
                <button class="btn-filter" onclick="setCategoryFilter('線上共學', this)">👥 線上共學</button>
                <button class="btn-filter" onclick="setCategoryFilter('重要期限', this)">⏰ 報名期限</button>
            </div>

            <!-- 年級篩選 -->
            <div class="filter-row">
                <span class="filter-label">服務年級：</span>
                <button class="btn-filter active" onclick="setGradeFilter('all', this)">全部</button>
                <button class="btn-filter" onclick="setGradeFilter('一年級', this)">一年級</button>
                <button class="btn-filter" onclick="setGradeFilter('二年級', this)">二年級</button>
                <button class="btn-filter" onclick="setGradeFilter('四年級', this)">四年級</button>
                <button class="btn-filter" onclick="setGradeFilter('五年級', this)">五年級</button>
            </div>

            <!-- 關鍵字搜尋與衝堂篩選 -->
            <div class="filter-row">
                <span class="filter-label">快速搜尋：</span>
                <input type="text" id="searchInput" class="search-input" placeholder="搜尋日期、夥伴姓名（如陳新昱、蔡幼姿）、地點或關鍵字..." oninput="renderTable()">
                <button class="btn-filter" id="btnOnlyWarning" onclick="toggleWarningOnly(this)">⚡ 僅看同日提醒</button>
            </div>

            <!-- 操作按鈕列 -->
            <div class="action-buttons-row">
                <div id="countSummary" class="count-summary">共 27 筆排程項目</div>
                <div style="display: flex; gap: 0.6rem;">
                    <button class="btn-action" onclick="copyFilteredList()">📋 複製目前清單 (LINE文案)</button>
                    <button class="btn-action" onclick="window.print()">🖨️ 列印表單</button>
                </div>
            </div>
        </div>

        <!-- 行事曆表格 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>日期 / 星期</th>
                        <th>時間</th>
                        <th>類別</th>
                        <th>年級 / 資格</th>
                        <th>活動名稱與內容</th>
                        <th>衝堂 / 接軌提示</th>
                    </tr>
                </thead>
                <tbody id="scheduleTableBody">
                    <!-- JS 動態生成 -->
                </tbody>
            </table>
        </div>
    </div>

            { id: "EV-23", date: "11/25", day: "三", time: "13:00~16:00", cat: "外訓演練", grade: "二年級", role: "二年級主講", title: "二年級外訓 第 3 次（督導協助演練備課）", alert: "safe", alertText: "🟢 獨立排程", notes: "原需求註記11/25(二)，實為週三" },
            { id: "EV-24", date: "12/08", day: "二", time: "13:00~15:00<br>15:00~15:30", cat: "入班志工", grade: "二年級", role: "主講+志工", title: "二年級 EQ 入班 第 1 天（課後討論 15:00~15:30）", alert: "safe", alertText: "🟢 獨立排程", notes: "二年級入班開始" },
            { id: "EV-25", date: "12/15", day: "二", time: "13:00~15:00<br>15:00~15:30", cat: "入班志工", grade: "二年級", role: "主講+志工", title: "二年級 EQ 入班 第 2 天（課後討論 15:00~15:30）", alert: "safe", alertText: "🟢 獨立排程", notes: "二年級入班第 2 次" },
            { id: "EV-26", date: "12/22", day: "二", time: "13:00~15:00<br>15:00~15:30", cat: "入班志工", grade: "二年級", role: "主講+志工", title: "二年級 EQ 入班 第 3 天（課後討論 15:00~15:30）", alert: "safe", alertText: "🟢 獨立排程", notes: "二年級入班圓滿完成" }
        ];

        let selectedCategory = 'all';
        let selectedGrade = 'all';
        let onlyWarning = false;

        function setCategoryFilter(cat, btn) {
            selectedCategory = cat;
            btn.parentElement.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function setGradeFilter(gr, btn) {
            selectedGrade = gr;
            btn.parentElement.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function toggleWarningOnly(btn) {
            onlyWarning = !onlyWarning;
            btn.classList.toggle('active', onlyWarning);
            renderTable();
        }

        function getCategoryClass(cat) {
            switch(cat) {
                case '入班志工': return 'cat-volunteer';
                case '外訓演練': return 'cat-training';
                case '線上共學': return 'cat-online';
                default: return 'cat-deadline';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('scheduleTableBody');
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

            const filtered = scheduleData.filter(item => {
                if (selectedCategory !== 'all' && item.cat !== selectedCategory) return false;
                if (selectedGrade !== 'all' && item.grade !== selectedGrade && item.grade !== '全體') return false;
                if (onlyWarning && item.alert !== 'warn') return false;
                if (searchKeyword) {
                    const str = `${item.date} ${item.time} ${item.cat} ${item.grade} ${item.role} ${item.title} ${item.notes} ${item.alertText}`.toLowerCase();
                    if (!str.includes(searchKeyword)) return false;
                }
                return true;
            });

            document.getElementById('countSummary').innerText = `符合條件：共 ${filtered.length} 筆項目`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 2.5rem; color: var(--text-sub);">無符合條件之排程項目</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr>
                    <td style="font-weight:700; color:var(--text-main); white-space:nowrap;">
                        ${item.date} <span style="color:var(--accent-gold);">(${item.day})</span>
                    </td>
                    <td style="font-size:0.88rem; color:var(--text-sub); white-space:nowrap;">
                        ${item.time}
                    </td>
                    <td>
                        <span class="pill-category ${getCategoryClass(item.cat)}">${item.cat}</span>
                    </td>
                    <td>
                        <span class="pill-grade">${item.grade}</span>
                        <div style="font-size:0.82rem; color:var(--text-sub); margin-top:0.2rem;">${item.role}</div>
                    </td>
                    <td>
                        <div style="font-weight:700; color:#fff;">${item.title}</div>
                        <div style="font-size:0.84rem; color:var(--text-sub); margin-top:0.2rem;">${item.notes}</div>
                    </td>
                    <td>
                        <span class="alert-badge ${item.alert === 'warn' ? 'alert-warn' : 'alert-safe'}">
                            ${item.alertText}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function copyFilteredList() {
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = scheduleData.filter(item => {
                if (selectedCategory !== 'all' && item.cat !== selectedCategory) return false;
                if (selectedGrade !== 'all' && item.grade !== selectedGrade && item.grade !== '全體') return false;
                if (onlyWarning && item.alert !== 'warn') return false;
                if (searchKeyword) {
                    const str = `${item.date} ${item.time} ${item.cat} ${item.grade} ${item.role} ${item.title} ${item.notes}`.toLowerCase();
                    if (!str.includes(searchKeyword)) return false;
                }
                return true;
            });

            const text = filtered.map(i => `‧ ${i.date}(${i.day}) ${i.time.replace('<br>', ' ')} [${i.cat}] ${i.grade} - ${i.title}`).join('\n');
            const fullText = `【樂利EQ 115上學期 行事曆精選】\n${text}\n\n🔗 完整排程速查：https://eqweb0987183520.github.io/webData/course-info.html`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullText).then(() => showToast());
            } else {
                const ta = document.createElement('textarea');
                ta.value = fullText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast();
            }
        }

        function showToast() {
            const t = document.getElementById('toastNotice');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        // 初始化渲染
        renderTable();
    </script>
</body>
</html>
